<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Slip</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Smart Slip">
  <meta name="application-name" content="Smart Slip">
  <meta name="theme-color" content="#0e0e0e">
  <link rel="apple-touch-icon" href="smart_slip_icon.png">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0e0e0e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      text-align: center;
    }
    img.logo { width: 112px; height: 112px; border-radius: 26px; }
    h1 { font-size: 28px; margin: 16px 0 6px; }
    p.sub { margin: 0 0 22px; opacity: .7; }
    a.btn {
      display: inline-block;
      background: #c9a227;
      color: #000;
      text-decoration: none;
      font-weight: 700;
      padding: 16px 28px;
      border-radius: 14px;
      font-size: 17px;
    }
    .card {
      max-width: 340px;
      margin-top: 28px;
      background: #161616;
      border-radius: 16px;
      padding: 16px 18px;
      text-align: left;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <img class="logo" src="smart_slip_icon.png" alt="Smart Slip">
  <h1>Smart Slip</h1>
  <p class="sub">Timeslips • Weather • Predictions</p>
  <a class="btn" href="https://smart-slip.streamlit.app/">Open Smart Slip</a>
  <div class="card">
    <div style="font-weight:700;margin-bottom:8px;">Save it like an app</div>
    1. Open this in Safari<br>
    2. Tap Open Smart Slip<br>
    3. ··· → Share → Add to Home Screen<br>
    4. Name it Smart Slip
  </div>
</body>
</html>
